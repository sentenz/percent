# SPDX-License-Identifier: Apache-2.0

name: Regal

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  regal:
    name: Regal Action
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Run Regal
        uses: sentenz/actions/regal@9f37c086ab1c2d31687e731bfbc6184e0b882a7f # 1.4.10
        with:
          path: "./tests/policy"
          regal-version: "latest"
