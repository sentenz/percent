name: Regenerate Go artifacts for PR 143

on:
  push:
    branches:
      - renovate/go-dependencies

jobs:
  regenerate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: 'go.mod'

      - name: Regenerate module artifacts
        run: |
          go mod tidy
          go mod vendor

      - name: Commit regenerated artifacts and remove temporary workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/regenerate-pr143.yml
          git add go.mod go.sum vendor/
          git diff --cached --quiet && exit 0
          git commit -m 'fix(deps): regenerate Go module artifacts'
          git push origin HEAD:renovate/go-dependencies
