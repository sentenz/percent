# SPDX-License-Identifier: Apache-2.0

name: Conftest

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  conftest:
    name: Conftest Action
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run Conftest
        uses: sentenz/actions/conftest@1491eeb075bc01903aee09bb3e43bffccf9e6662 # 1.1.4
        with:
          policy-path: "./tests/policy"
